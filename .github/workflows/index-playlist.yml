name: Index complete YouTube Music playlist

on:
  push:
    branches:
      - main
      - agent/full-playlist-catalog
    paths:
      - .github/workflows/index-playlist.yml
      - scripts/index-playlist.mjs
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: playlist-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install playlist extractor
        run: python -m pip install --disable-pip-version-check --upgrade yt-dlp curl_cffi

      - name: Read every playlist continuation
        env:
          PLAYLIST_URL: https://www.youtube.com/playlist?list=PL0gpFgtesNu015JGaKSx8BonbVjGRefKb
        run: |
          yt-dlp \
            --flat-playlist \
            --dump-single-json \
            --ignore-errors \
            --no-warnings \
            --extractor-args 'youtube:player_client=web' \
            "$PLAYLIST_URL" > /tmp/fretline-playlist.json

      - name: Build static catalog
        env:
          MIN_PLAYLIST_ENTRIES: '1000'
        run: node scripts/index-playlist.mjs /tmp/fretline-playlist.json src/data/playlist-catalog.json

      - name: Validate generated application
        run: |
          node --check scripts/index-playlist.mjs
          npm test
          npm run check

      - name: Commit refreshed catalog
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/playlist-catalog.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'Refresh complete playlist catalog'
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish scheduled main refresh
        if: steps.commit.outputs.changed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin HEAD:gh-pages
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
