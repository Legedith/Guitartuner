name: Allow main to deploy GitHub Pages

on:
  push:
    branches:
      - agent/retry-pages-build
    paths:
      - .github/workflows/retry-pages-build.yml

permissions:
  actions: write
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Allow main in the github-pages environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/environments/github-pages/deployment-branch-policies" \
            -f name=main \
            -f type=branch
