name: Dispatch gh-pages deployment

on:
  push:
    branches:
      - agent/retry-pages-build
    paths:
      - .github/workflows/retry-pages-build.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Run the gh-pages deployment workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-gh-pages.yml/dispatches" \
            -f ref=gh-pages
